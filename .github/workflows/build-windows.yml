name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            baobox-windows

      # 这一步是这条流水线最有价值的地方：覆盖层、标注编辑器、托盘、
      # 设置窗口那些测试都带 `cfg(windows)`，在开发机上只能类型检查，
      # **只有在真 Windows 上才真正跑得起来**。
      # 共享库（qiaob/baobox_shared）的测试在那边自己的 CI 里跑，这里按 git 标签取用。
      - name: Test
        working-directory: baobox-windows
        run: cargo test --all-targets

      # 用 `cargo rustc -- -D warnings` 而不是 `RUSTFLAGS`：
      # 后者会一并作用到所有第三方依赖上，别人代码里的一个 warning
      # 就能把我们的流水线弄红。
      - name: Build release (warnings are errors)
        working-directory: baobox-windows
        run: cargo rustc --release -- -D warnings

      - uses: actions/upload-artifact@v4
        with:
          name: baobox-windows-x86_64
          path: baobox-windows/target/release/baobox-windows.exe
          if-no-files-found: error

  # 风格与 lint：rustfmt 不合格、clippy 有任何警告都算失败。
  # 工具链固定版本：新版 clippy 会加新检查，不该让无关的提交突然变红。
  # 升级时改这里（以及 baobox_shared、baobox_linux 的工作流），顺手修掉新冒出来的。
  lint:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: baobox-windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            baobox-windows

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
